name: Run Fundamentals Monthly

on:
  schedule:
    - cron: '0 21 15 * *'  # 15th of every month at 6:00 JST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      JQUANTS_EMAIL: ${{ secrets.JQUANTS_EMAIL }}
      JQUANTS_PASSWORD: ${{ secrets.JQUANTS_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run save_fundamentals
        run: python db/save_fundamentals.py
