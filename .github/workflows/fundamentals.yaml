name: Save Fundamentals Weekly

on:
  schedule:
    - cron: '0 4 * * 0'  # Every Sunday at 13:00 JST
  workflow_dispatch:

jobs:
  run-fundamentals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run save_fundamentals.py
        run: python db/save_fundamentals.py
