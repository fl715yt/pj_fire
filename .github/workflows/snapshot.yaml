name: Save Snapshots Daily

on:
  schedule:
    - cron: '0 9 * * 1-5'  # Every weekday at 18:00 JST
  workflow_dispatch:

jobs:
  run-snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run save_snapshots.py
        run: python db/save_snapshots.py
